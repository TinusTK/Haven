[workspace]
resolver = "3"
members = ["crates/haven-core", "crates/haven-app", "crates/haven-player"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
haven-core = { path = "crates/haven-core" }
directories = "6"
glow = "0.18"
libmpv2 = "7.0.1"
png = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
slint-build = "1.18"
tempfile = "3"
thiserror = "2"
