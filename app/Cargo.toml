[workspace]
resolver = "3"
members = [
    "crates/haven-core",
    "crates/haven-addons",
    "crates/haven-titles",
    "crates/haven-livetv",
    "crates/haven-servers",
    "crates/haven-metadata",
    "crates/haven-tracking",
    "crates/haven-cast",
    "crates/haven-app",
    "crates/haven-hub",
    "crates/haven-player",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
publish = false

[workspace.dependencies]
haven-cast = { path = "crates/haven-cast" }
haven-core = { path = "crates/haven-core" }
haven-addons = { path = "crates/haven-addons" }
haven-titles = { path = "crates/haven-titles" }
haven-livetv = { path = "crates/haven-livetv" }
haven-metadata = { path = "crates/haven-metadata" }
haven-player = { path = "crates/haven-player" }
haven-tracking = { path = "crates/haven-tracking" }
haven-servers = { path = "crates/haven-servers" }
directories = "6"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libmpv2 = "7.0.1"
png = "0.18"
# TLS through rustls with the ring provider: no OpenSSL to install on Linux
# and no NASM needed to build on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
slint-build = "1.18"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "fs", "io-util"] }
