[package]
name = "haven-player"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The mpv spike needs libmpv on the machine, so it is behind a feature: a
# plain `cargo build --workspace` or `cargo test --workspace` does not need it.
[features]
mpv-spike = ["dep:glow", "dep:libmpv2", "dep:png", "dep:slint"]

[dependencies]
glow = { workspace = true, optional = true }
libmpv2 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
slint = { workspace = true, optional = true }

[[example]]
name = "mpv_spike"
required-features = ["mpv-spike"]
