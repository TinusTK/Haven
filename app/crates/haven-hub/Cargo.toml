[package]
name = "haven-hub"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Haven Hub: Haven without a screen, for a Raspberry Pi or a small server"

[[bin]]
name = "haven-hub"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
haven-addons.workspace = true
haven-core.workspace = true
haven-titles.workspace = true
haven-tracking.workspace = true
reqwest.workspace = true
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
