[package]
name = "haven-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

description = "Haven: a media player for Jellyfin, Plex, Emby and IPTV, and a film and TV show tracker"
license = "GPL-3.0-only"
authors = ["TinusTK"]

[[bin]]
name = "haven"
path = "src/main.rs"

# The app itself is a library: the desktop program above starts it, and
# on Android it is loaded as a shared library by the system.
[lib]
name = "haven_app"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

# The player needs libmpv on the machine, so it is opt-in for now:
# `cargo run -p haven-app --features player`. Without it Haven builds
# everywhere and lists streams without playing them.
[dev-dependencies]
# Headless window for the touch-scrolling tests (tests/swipe.rs).
i-slint-backend-testing = "=1.18.1"

[features]
default = ["addons"]
player = ["haven-player/mpv"]
# Add-ons: the builds on GitHub have them.
addons = ["dep:haven-addons", "haven-servers/shared-addons"]
# The App Store (TestFlight) build: media servers only on the home network
# or Tailscale, and no add-on code at all:
# `--no-default-features --features store,player`. (The Google Play build
# is `--no-default-features --features player,addons`: no limit on server
# addresses, and the Stremio sign-in; Android shows no add-on screens.)
store = ["haven-servers/own-network"]

[dependencies]
ring = "0.17"
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
haven-addons = { workspace = true, optional = true }
haven-titles.workspace = true
directories.workspace = true
haven-cast.workspace = true
haven-core.workspace = true
haven-livetv.workspace = true
haven-metadata.workspace = true
haven-player.workspace = true
haven-servers.workspace = true
haven-tracking.workspace = true
image.workspace = true
png.workspace = true
reqwest.workspace = true
serde.workspace = true
slint.workspace = true
# The device's region, for the country in Settings (Slint uses it too).
sys-locale = "0.3"
tokio.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo deb -p haven-app --features player` makes target/debian/haven_*.deb.
# libmpv comes from the distribution (not shipped inside the package).
[package.metadata.deb]
name = "haven"
maintainer = "TinusTK"
copyright = "2026, TinusTK. Licensed under the GNU GPL version 3."
extended-description = """\
A media player for your own Jellyfin, Emby and Plex servers and for IPTV \
(live TV and radio from M3U playlists and Xtream Codes accounts), and a \
film and TV show tracker: a watchlist, a calendar of what comes out when, \
Trakt and Simkl, and Chromecast casting."""
section = "video"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/haven", "usr/bin/haven", "755"],
    ["../../../linux/haven.desktop", "usr/share/applications/haven.desktop", "644"],
    ["../../assets/icon/haven-48.png", "usr/share/icons/hicolor/48x48/apps/haven.png", "644"],
    ["../../assets/icon/haven-64.png", "usr/share/icons/hicolor/64x64/apps/haven.png", "644"],
    ["../../assets/icon/haven-128.png", "usr/share/icons/hicolor/128x128/apps/haven.png", "644"],
    ["../../assets/icon/haven-256.png", "usr/share/icons/hicolor/256x256/apps/haven.png", "644"],
    ["../../assets/icon/haven-512.png", "usr/share/icons/hicolor/512x512/apps/haven.png", "644"],
    ["../../../LICENSE", "usr/share/doc/haven/LICENSE", "644"],
    ["../../../THIRD-PARTY.md", "usr/share/doc/haven/THIRD-PARTY.md", "644"],
]

# Android: Slint's own Android backend, and what the APK is called.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
jni = "0.21"

[package.metadata.android]
package = "net.haven.app"
build_targets = ["aarch64-linux-android"]
resources = "../../../android/res"
# libmpv for the player, put there by android/fetch-libmpv.sh.
runtime_libs = "../../../android/libmpv"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "Haven"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Library > Local: the phone's videos (asked for when the tab opens).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode"

# Phones and tablets start Haven from the app list, Android TV from its
# own launcher (LEANBACK_LAUNCHER).
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]

# Haven also runs on Android TV: it needs neither a touch screen nor the
# TV's own interface library, so phones and TVs install the same APK.
[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

# iOS: opening a web address or another app (a video player) goes
# through the system; there are no programs to start.
[target.'cfg(target_os = "ios")'.dependencies]
# The player hides the status bar and home bar through the window.
slint = { workspace = true, features = ["unstable-winit-030"] }
winit = { version = "0.30", default-features = false }
webbrowser = "1"
libc = "0.2"
