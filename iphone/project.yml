# Haven for iPhone, written in Swift. The Xcode project is made from this
# file with XcodeGen (`xcodegen generate` in this folder) and is not kept
# in git.
#
# Two kinds of build, as with the Rust app:
#   scheme Haven       (Debug / Release)        GitHub IPA: add-ons, no network limit
#   scheme HavenStore  (StoreDebug / Store)     App Store / TestFlight: no add-ons,
#                                               media servers on the Local Area Network only
name: Haven

options:
  bundleIdPrefix: net.haven
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  StoreDebug: debug
  Store: release

packages:
  # SQLite (MIT licence). Pinned to one version; move it on purpose.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0
  # libmpv with FFmpeg for Apple TV (LGPL build, product MPVKit). The
  # iPhone app keeps the media-kit copy from ../ios/fetch-libmpv.sh.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

settings:
  base:
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "0.2.5"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3ERX27ETC6
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # libmpv and the libraries it loads, fetched by ../ios/fetch-libmpv.sh
    # (here for every target, so the tests can see the Mpv module too)
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../ios/libmpv/device"
    "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../ios/libmpv/simulator"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ADDONS
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ADDONS
    StoreDebug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STORE
    Store:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: STORE

targets:
  Haven:
    type: application
    platform: iOS
    sources:
      - path: Haven
        excludes:
          - "Support/*.entitlements"
          - "Support/Info.plist"
    dependencies:
      - package: GRDB
    # Info.plist is ours (no `info:` here, or XcodeGen rewrites it).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.haven.app
        PRODUCT_NAME: Haven
        EXECUTABLE_NAME: Haven
        INFOPLIST_FILE: Haven/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -framework Mpv"
      configs:
        StoreDebug:
          CODE_SIGN_ENTITLEMENTS: Haven/Support/HavenStore.entitlements
        Store:
          CODE_SIGN_ENTITLEMENTS: Haven/Support/HavenStore.entitlements
    preBuildScripts:
      - name: Build keys
        # Haven/Generated/BuildKeys.swift: in the sources, not kept in git.
        script: '"$SRCROOT/scripts/build-keys.sh" "$SRCROOT/Haven/Generated/BuildKeys.swift"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Embed libmpv
        script: '"$SRCROOT/scripts/embed-libmpv.sh"'
        basedOnDependencyAnalysis: false

  # Haven for Apple TV: the iPhone app's models and services, its own
  # remote-driven screens in HavenTV/. App Store build only (HavenStore
  # configs); same bundle ID as the iPhone app (one App Store record).
  HavenTV:
    type: application
    platform: tvOS
    sources:
      - path: Haven
        excludes:
          - "Support/*.entitlements"
          - "Support/Info.plist"
          - "App/HavenApp.swift"
          - "App/RootView.swift"
          - "UI/AirPlayBar.swift"
          - "UI/CalendarPage.swift"
          - "UI/ExplorePage.swift"
          - "UI/Field.swift"
          - "UI/Home.swift"
          - "UI/LibraryPage.swift"
          - "UI/LiveTVPage.swift"
          - "UI/Pages.swift"
          - "UI/PlayerView.swift"
          - "UI/SettingsPage.swift"
          - "UI/TabBar.swift"
          - "UI/TitlePageView.swift"
          - "AirPlay/AirPlayButton.swift"
          - "Generated/BuildKeys.swift"
      - path: HavenTV
        excludes:
          - "Support/Info.plist"
          - "scripts/**"
    dependencies:
      - package: GRDB
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.haven.app
        PRODUCT_NAME: Haven
        EXECUTABLE_NAME: Haven
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: HavenTV/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    preBuildScripts:
      - name: Build keys
        script: '"$SRCROOT/scripts/build-keys.sh" "$SRCROOT/HavenTV/Generated/BuildKeys.swift"'
        basedOnDependencyAnalysis: false

  HavenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HavenTests
    dependencies:
      - target: Haven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.haven.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Haven.app/Haven"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Haven:
    build:
      targets:
        Haven: all
        HavenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HavenTests]
    archive:
      config: Release
  HavenStore:
    build:
      targets:
        Haven: all
        HavenTests: [test]
    run:
      config: StoreDebug
    test:
      config: StoreDebug
      targets: [HavenTests]
    archive:
      config: Store
  HavenTV:
    build:
      targets:
        HavenTV: all
    run:
      config: StoreDebug
    archive:
      config: Store
