name: Website and SideStore source

# Publishes Haven's website (the `website/` folder: home page, privacy
# policy, terms) and the official AltStore / SideStore source on GitHub
# Pages: https://tinustk.github.io/Haven/ and .../source.json. Runs when a
# release is published (the source lists it) and when the website changes.
on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sidestore-source
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}source.json
    steps:
      - uses: actions/checkout@v4
      - name: Build source.json
        run: python3 ios/sidestore_source.py site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the website
        run: cp -R website/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
