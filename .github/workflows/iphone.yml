name: iPhone and Apple TV (Swift)

# The Swift apps in iphone/: the iPhone app (the "iphone" job) and the
# Apple TV app (the "tv" job). Each runs only when its own files change
# (see the "changes" job); "[ci all]" in a commit message, or Run
# workflow, runs both. The Rust builds are in build.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job has its own concurrency group: a newer push waits for the
# running build instead of cutting it short, and a push that skips a
# build doesn't touch it.

env:
  # No TMDB key is built in: everyone adds their own in Settings › Keys.
  HAVEN_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
  HAVEN_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
  HAVEN_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
  HAVEN_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

jobs:
  # Which apps this run needs. iPhone: iphone/ except the Apple TV files.
  # Apple TV: any of iphone/ (it is built from the iPhone app's code too). Both: the project
  # file, the libmpv script, this file.
  changes:
    name: Which apps
    runs-on: ubuntu-latest
    outputs:
      iphone: ${{ steps.pick.outputs.iphone }}
      tv: ${{ steps.pick.outputs.tv }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(.github/scripts/changes.sh)"
          shared='^(iphone/project\.yml$|ios/fetch-libmpv\.sh$|\.github/workflows/iphone\.yml$|\.github/scripts/changes\.sh$)'
          tv='^(iphone/HavenTV/|iphone/scripts/(build|package)-tv\.sh$)'
          if [ "$files" = ALL ] || grep -qE "$shared" <<<"$files"; then
            iphone=true; apple_tv=true
          else
            grep -E '^iphone/' <<<"$files" | grep -qvE "$tv" && iphone=true || iphone=false
            grep -qE '^iphone/' <<<"$files" && apple_tv=true || apple_tv=false
          fi
          echo "iPhone: $iphone, Apple TV: $apple_tv"
          echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          echo "tv=$apple_tv" >> "$GITHUB_OUTPUT"

  iphone:
    name: Build and test (GitHub and App Store builds)
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    concurrency:
      group: iphone-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The newest Xcode on the machine: the App Store wants the newest
      # iOS SDK (iOS 27 from April 2027).
      - name: Use the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch libmpv for iOS
        run: ios/fetch-libmpv.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pick a simulator
        run: |
          name="$(xcrun simctl list devices available | grep -E '^\s+iPhone' | tail -1 | sed -E 's/^ +//; s/ \(.*//')"
          echo "Simulator: $name"
          echo "HAVEN_SIMULATOR=$name" >> "$GITHUB_ENV"
      - name: Tests (GitHub build)
        run: iphone/scripts/build.sh github test
      - name: Tests (App Store build)
        run: iphone/scripts/build.sh store test
      # The GitHub IPA: add-ons, unsigned (whoever installs it signs it).
      - name: GitHub IPA (unsigned)
        run: iphone/scripts/package.sh github
      - uses: actions/upload-artifact@v4
        with:
          name: haven-swift-ios-ipa
          path: iphone/build/ipa/*.ipa
          if-no-files-found: error
      # With an Apple Distribution certificate and an App Store
      # provisioning profile in the secrets the store IPA is signed for the
      # App Store; without, it is built unsigned (for testing).
      - name: Set up signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "No App Store certificate or profile in the secrets: the IPA is left unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/haven-ios.keychain-db"
          lock="$(uuidgen)"
          security create-keychain -p "$lock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$lock" "$keychain"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$lock" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -E "Apple Distribution|iPhone Distribution" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$identity" ] || { echo "The certificate in the secrets is not an Apple Distribution one."; exit 1; }
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/appstore.mobileprovision"
          echo "HAVEN_IOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HAVEN_IOS_PROFILE=$RUNNER_TEMP/appstore.mobileprovision" >> "$GITHUB_ENV"
      # Includes the store check: no add-on code or wording.
      - name: App Store IPA
        run: iphone/scripts/package.sh store
      - uses: actions/upload-artifact@v4
        with:
          name: haven-swift-ios-store
          path: iphone/build/ipa/*.ipa
          if-no-files-found: error

  # The Apple TV app, both kinds, built for a device without signing: the
  # GitHub IPA (add-ons; whoever installs it signs it) and the App Store
  # build with the store check (its signed IPA is made locally).
  tv:
    name: Apple TV (GitHub and App Store builds)
    needs: changes
    if: needs.changes.outputs.tv == 'true'
    concurrency:
      group: tv-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      # The project also holds the iPhone target, which wants libmpv there.
      - name: Fetch libmpv for iOS
        run: ios/fetch-libmpv.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: GitHub IPA (Apple TV, unsigned)
        run: iphone/scripts/package-tv.sh github
      - uses: actions/upload-artifact@v4
        with:
          name: haven-swift-tvos-ipa
          path: iphone/build/tv-ipa/*.ipa
          if-no-files-found: error
      - name: Build (Apple TV, App Store kind)
        run: iphone/scripts/build-tv.sh store device
