name: Haven Hub image

# Builds the Haven Hub container for Raspberry Pi (arm64) and x86-64 and
# puts it on GitHub's container registry as ghcr.io/<owner>/haven-hub,
# tagged with the version and "latest". Runs for each version tag, or by
# hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: names
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/haven-hub"
          tags="$image:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$tags,$image:${GITHUB_REF#refs/tags/v}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: |
            HAVEN_TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
            HAVEN_SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
