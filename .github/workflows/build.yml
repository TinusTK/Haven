name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each build runs only when its own files change (see the "changes" job);
# "[ci all]" in a commit message runs them all. Each job has its own
# concurrency group, so a push that skips a build never cancels it.

env:
  CARGO_TERM_COLOR: always
  # One of the libraries (Chromecast support) brings in aws-lc, which
  # otherwise wants the NASM assembler installed on Windows.
  AWS_LC_SYS_PREBUILT_NASM: 1
  # No TMDB key is built in (user, 2026-11-23): everyone adds their own,
  # free from themoviedb.org, in Settings › Keys.
  # Haven's own Trakt app (trakt.tv/oauth/applications), for Link in Settings.
  HAVEN_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
  HAVEN_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
  # Haven's own Simkl app (simkl.com/settings/developer), for Link in Settings.
  HAVEN_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
  # Haven's own OMDb key (omdbapi.com), for Rotten Tomatoes scores.
  HAVEN_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

# The iPhone and iPad app is the Swift one in iphone/, built by
# iphone.yml. The old Rust iOS code was removed (0.2.6 build 3).
# The Android app is the Kotlin one in android/, built by android.yml;
# this workflow no longer builds Android, so a push that changes only
# android/ runs none of these builds.
jobs:
  # Which builds this run needs. The shared Rust code (app/) or this file
  # runs all five; a platform's own folder runs only that platform.
  # "[ci all]" in a commit message, or Run workflow, runs everything.
  changes:
    name: Which builds
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(.github/scripts/changes.sh)"
          shared='^(app/|\.github/workflows/build\.yml$|\.github/scripts/changes\.sh$)'
          pick() {
            if [ "$files" = ALL ] || grep -qE "$shared|$2" <<<"$files"; then on=true; else on=false; fi
            echo "$1: $on"
            echo "$1=$on" >> "$GITHUB_OUTPUT"
          }
          pick windows '^windows/'
          pick linux '^linux/'
          pick macos '^mac/'

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Test
        run: cargo test --workspace
      # The player needs an LGPL libmpv: the script downloads the checked
      # copy kept as a release of this repository, verifies its checksum
      # and makes mpv.lib (see windows/libmpv/README.md).
      - name: Fetch libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../windows/fetch-libmpv.ps1
      - name: Build release with the player
        run: cargo build --release -p haven-app --features player
      # Starts haven.exe from a folder laid out like an installed copy.
      # Fails if Windows cannot find a DLL it needs, or if it runs without
      # Haven's own libmpv and Vulkan loader. The build machine has no
      # real graphics, so an early exit for another reason is a warning.
      - name: Check haven.exe starts
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "haven-start"
          New-Item $dir -ItemType Directory | Out-Null
          Copy-Item target/release/haven.exe $dir
          Copy-Item ../windows/libmpv/*.dll $dir
          $said = Join-Path $dir "stderr.txt"
          $p = Start-Process (Join-Path $dir "haven.exe") -PassThru -RedirectStandardError $said
          if ($p.WaitForExit(15000)) {
            if (Test-Path $said) { Get-Content $said | ForEach-Object { Write-Host "haven.exe said: $_" } }
            if ($p.ExitCode -eq -1073741515) { throw "haven.exe could not find a DLL it needs" }
            Write-Host "::warning::haven.exe stopped early with exit code $($p.ExitCode); its DLLs were found"
          } else {
            $p.Refresh()
            $loaded = $p.Modules | Where-Object { $_.ModuleName -in "libmpv-2.dll", "vulkan-1.dll" }
            $loaded | ForEach-Object { Write-Host "loaded: $($_.FileName)" }
            $p.Kill()
            $own = @($loaded | Where-Object { $_.FileName.StartsWith($dir, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($own.Count -ne 2) { throw "haven.exe is running without its own libmpv-2.dll and vulkan-1.dll" }
            Write-Host "haven.exe started with its own libmpv-2.dll and vulkan-1.dll"
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "haven-app" } | Select-Object -ExpandProperty version
          iscc "/DAppVersion=$version" ..\windows\haven.iss
      - uses: actions/upload-artifact@v4
        with:
          name: haven-windows-x64
          path: app/target/release/haven.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: haven-windows-x64-setup
          path: app/target/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    concurrency:
      group: build-linux-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Test
        run: cargo test --workspace
      - name: Build release with the player
        run: cargo build --release -p haven-app --features player
      - name: Build the .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p haven-app --features player --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: haven-linux-x64
          path: app/target/release/haven
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: haven-linux-x64-deb
          path: app/target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    concurrency:
      group: build-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Test
        run: cargo test --workspace
      # The player needs an LGPL libmpv: the script downloads the checked
      # copy kept as a release of this repository and verifies its
      # checksum. It ships inside Haven.app beside the program.
      - name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../mac/fetch-libmpv.sh
      # With a Developer ID certificate in the repository's secrets the
      # app is signed with it and notarised by Apple; without, it is
      # signed "ad hoc" and macOS warns the first time it is opened.
      - name: Set up signing
        env:
          # The same names, and the same values, as the developer's
          # other Mac app uses: a Developer ID certificate belongs to
          # the developer, not to one app.
          MACOS_CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "No certificate in the secrets: this build is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/haven-signing.keychain-db"
          lock="$(uuidgen)"
          security create-keychain -p "$lock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$lock" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$lock" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$identity" ] || { echo "The certificate in the secrets is not a Developer ID Application one."; exit 1; }
          echo "HAVEN_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Builds for Intel and Apple silicon, joins the two, and makes
      # Haven.app and the disk image. Fails if the program is linked
      # against a libmpv outside the app.
      - name: Build Haven.app and the disk image
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          HAVEN_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          HAVEN_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # The App Store Connect key Apple notarises with, as a file.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            export HAVEN_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          fi
          ../mac/bundle.sh universal
          rm -f "$RUNNER_TEMP/notary-key.p8"
      # lsof, not DYLD_PRINT_LIBRARIES: a signed app ignores that.
      - name: Check Haven starts with its own libmpv
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" target/macos/Haven.app/Contents/MacOS/haven > "$RUNNER_TEMP/run.txt" 2>&1 &
          app=$!
          sleep 15
          lsof -p "$app" > "$RUNNER_TEMP/open.txt" 2>/dev/null || true
          kill "$app" 2>/dev/null || true
          grep "Haven.app/Contents/Frameworks/libmpv.dylib" "$RUNNER_TEMP/open.txt" \
            || { tail -30 "$RUNNER_TEMP/run.txt"; echo "Haven did not load its own libmpv"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: haven-macos-dmg
          path: app/target/macos/*.dmg
          if-no-files-found: error
